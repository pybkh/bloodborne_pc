name: Build Windows

on:
  push:
    branches: [ windows-port, main, master ]
  pull_request:
    branches: [ windows-port, main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows x86_64, MSYS2 CLANG64)
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2 (CLANG64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-ffmpeg

      - name: Verify Vulkan headers version
        run: |
          # README: vulkan-headers must be >= 1.4.350
          grep -R "PhysicalDeviceShaderMixedFloatDotProductFeaturesVALVE" \
            /clang64/include/vulkan/ 2>/dev/null \
            && echo "Vulkan headers OK" \
            || (echo "ERROR: vulkan-headers too old, update MSYS2"; exit 1)

      - name: Build bbport (Windows)
        run: bash build.sh

      - name: Show build outputs
        run: |
          ls -la out || true
          ls -la out/gpu || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bbport-windows-x86_64
          path: |
            out/bb-probe.exe
            out/gpu/bbgpu.dll
          if-no-files-found: warn
          retention-days: 14
